name: Build lua-https Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout lua-https itself (this repo)
      - name: Checkout lua-https
        uses: actions/checkout@v4
        with:
          path: lua-https
          submodules: recursive

      # 2. Checkout love-android — lua-https on Android is built
      #    *inside* love-android, not standalone with plain CMake+NDK.
      #    See: https://github.com/love2d/lua-https#android
      - name: Checkout love-android
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          submodules: recursive
          path: love-android

      # 3. Drop lua-https into the expected jni/lua-modules location
      - name: Place lua-https inside love-android
        run: |
          rm -rf love-android/love/src/jni/lua-modules/lua-https
          cp -r lua-https love-android/love/src/jni/lua-modules/lua-https

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # NDK + CMake are pulled automatically by the Android Gradle Plugin
      # based on what love-android's build.gradle pins — no manual
      # setup-ndk step needed (and pinning your own version can cause
      # ABI/CMake mismatches with the project's native build config).

      - name: Grant execute permission for gradlew
        run: chmod +x love-android/gradlew

      # Builds all ABIs (arm64-v8a, armeabi-v7a, x86, x86_64) in one pass.
      # lua-https .so files end up embedded per-ABI under app/build,
      # since love-android's Gradle native build compiles every
      # jni/lua-modules/* subfolder together with the engine.
      - name: Build love-android (embeds lua-https)
        working-directory: love-android
        run: ./gradlew assembleNormalRecord

      # 4. Pull the resulting native libraries back out.
      #    They land under app/build/intermediates for each ABI once
      #    the external native build (Android.mk/CMake) has run.
      - name: Locate built lua-https .so files
        run: |
          mkdir -p out/arm64-v8a out/armeabi-v7a
          find love-android/app/build -type f -name "libhttps.so" -print

      - name: Copy arm64-v8a artifact
        run: |
          f=$(find love-android/app/build -path "*arm64-v8a*" -name "libhttps.so" | head -n1)
          [ -n "$f" ] && cp "$f" out/arm64-v8a/ || echo "libhttps.so not found for arm64-v8a"

      - name: Copy armeabi-v7a artifact
        run: |
          f=$(find love-android/app/build -path "*armeabi-v7a*" -name "libhttps.so" | head -n1)
          [ -n "$f" ] && cp "$f" out/armeabi-v7a/ || echo "libhttps.so not found for armeabi-v7a"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lua-https-android
          path: out/**
